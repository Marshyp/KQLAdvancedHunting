id: 5f1d40a2-3b88-4c19-9050-8efaf6707201
name: Password spray across multiple Microsoft Entra accounts
description: Detects a source IP failing authentication across many accounts followed by a successful sign-in.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes: [SigninLogs]
queryFrequency: PT10M
queryPeriod: PT30M
triggerOperator: gt
triggerThreshold: 0
tactics: [InitialAccess, CredentialAccess]
relevantTechniques: [T1110.003]
query: |
  let failures = SigninLogs
  | where TimeGenerated > ago(30m) and ResultType != 0
  | summarize FailureCount=count(), TargetedAccounts=dcount(UserPrincipalName), Accounts=make_set(UserPrincipalName, 50), FailureCodes=make_set(ResultType, 20) by IPAddress, bin(TimeGenerated, 10m)
  | where FailureCount >= 20 and TargetedAccounts >= 10;
  failures
  | join kind=inner (SigninLogs
      | where TimeGenerated > ago(30m) and ResultType == 0
      | project SuccessTime=TimeGenerated, IPAddress, SuccessfulAccount=UserPrincipalName, AppDisplayName, Location, UserId) on IPAddress
  | where SuccessTime between (TimeGenerated .. TimeGenerated + 20m)
  | project SuccessTime, IPAddress, SuccessfulAccount, UserId, AppDisplayName, Location, FailureCount, TargetedAccounts, Accounts, FailureCodes
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: SuccessfulAccount
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled
